previews:
  generation: off

services:
  - type: web
    name: gate-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: dist
    branch: main
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: gate-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: yarn install --frozen-lockfile && yarn build
    preDeployCommand: yarn db:migrate
    startCommand: yarn start:api
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gate-db
          property: connectionString
      - key: REDIS_CONNECTION_STRING
        fromService:
          name: gate-queue
          type: keyvalue
          property: connectionString
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: SALT
        value: "12"
      - key: DEVICE_JWT_SECRET
        generateValue: true
      - key: PRIVATE_CHECKIN_KEY
        sync: false
      - key: PUBLIC_CHECKIN_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: LOG_LEVEL
        value: info

  - type: web
    name: gate-worker
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: yarn install --frozen-lockfile && yarn build
    startCommand: yarn start:worker
    healthCheckPath: /
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: NODE_ENV
        value: production
      - key: PRIVATE_CHECKIN_KEY
        fromService:
          name: gate-api
          type: web
          envVarKey: PRIVATE_CHECKIN_KEY
      - key: PUBLIC_CHECKIN_KEY
        fromService:
          name: gate-api
          type: web
          envVarKey: PUBLIC_CHECKIN_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: gate-db
          property: connectionString
      - key: REDIS_CONNECTION_STRING
        fromService:
          name: gate-queue
          type: keyvalue
          property: connectionString
      - key: LOG_LEVEL
        value: info

  - type: keyvalue
    name: gate-queue
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: gate-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
