<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gate — Organiser console</title>
    <!--
      Read-only console. No styling beyond what makes a table legible, per the brief.
      The page holds no data of its own: console.js sends the organiser's bearer token to
      GET /v1/console/events, which is where authorisation is enforced.

      The stylesheet stays inline because Helmet's default policy allows 'unsafe-inline' for
      style-src but not script-src; the behaviour lives in console.js for that reason.
    -->
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        max-width: 60rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #999;
        padding: 0.4rem 0.6rem;
        text-align: left;
      }
      td.num {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>Organiser console</h1>

    <form id="token-form">
      <label for="token">Access token</label>
      <input id="token" name="token" type="password" size="50" autocomplete="off" required />
      <button type="submit">Load my events</button>
    </form>

    <p id="status" role="status"></p>

    <table id="events" hidden>
      <thead>
        <tr>
          <th>Event</th>
          <th>Status</th>
          <th>Starts</th>
          <th>Total</th>
          <th>Reserved</th>
          <th>Sold</th>
          <th>Remaining</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script src="/v1/console/console.js"></script>
  </body>
</html>
